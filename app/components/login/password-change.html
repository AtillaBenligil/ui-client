<div class="row">
  <div class="col-md-4 col-md-offset-4">
    <div class="panel panel-default" style="margin-top: 60px;">
      <div class="panel-heading">
        <h3 class="panel-title">Passwort ändern</h3>
      </div>
      <div class="panel-body">
        <p class="text-muted">
          Das Passwort wird im IRPsim-Verzeichnis geändert. Nach der Änderung ist
          eine erneute Anmeldung erforderlich.
        </p>

        <form name="passwordForm" ng-submit="changePassword()" novalidate>
          <div class="form-group">
            <label for="oldPassword">Bisheriges Passwort</label>
            <input id="oldPassword" name="oldPassword" type="password" class="form-control"
                   ng-model="passwords.oldPassword" required autofocus>
          </div>

          <div class="form-group">
            <label for="newPassword">Neues Passwort</label>
            <input id="newPassword" name="newPassword" type="password" class="form-control"
                   ng-model="passwords.newPassword" required>
          </div>

          <div class="form-group">
            <label for="repeatedPassword">Neues Passwort wiederholen</label>
            <input id="repeatedPassword" name="repeatedPassword" type="password" class="form-control"
                   ng-model="passwords.repeatedPassword" required>
            <span class="help-block text-danger"
                  ng-if="passwords.repeatedPassword && !passwordsMatch()">
              Die beiden Passwörter stimmen nicht überein.
            </span>
          </div>

          <div class="alert alert-danger" ng-if="error" role="alert">
            {{ error }}
          </div>

          <button type="submit" class="btn btn-primary btn-block"
                  ng-disabled="passwordForm.$invalid || busy || !passwordsMatch()">
            <span ng-if="!busy">Passwort ändern</span>
            <span ng-if="busy">Änderung läuft …</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
